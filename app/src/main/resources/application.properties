spring.application.name=stock

# safe  = SafePurchase, with pessimistic row locking (default)
# naive = NaivePurchase, no protection at all. Kept alive so the failure stays reproducible.
stock.purchase.mode=safe

spring.datasource.url=jdbc:postgresql://localhost:5432/stock
spring.datasource.username=stock
spring.datasource.password=stock
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.datasource.hikari.connection-init-sql=SET lock_timeout = '1s'; SET statement_timeout = '3s'
